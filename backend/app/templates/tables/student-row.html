<tr class="student-row" data-student-id="{{ student.id }}">
  <td><span class="avatar" aria-hidden="true">{{ student.name|initials }}</span></td>
  <td><button type="button" class="student-identity" aria-haspopup="dialog"
      hx-get="{{ url_for('admin_student_detail', student_id=student.id) }}?{{ request.url.query }}"
      hx-target="#modal-content" hx-swap="innerHTML">
      <span class="student-name">{{ student.name }}</span>
      <span class="student-nisn">NISN {{ student.nisn }}</span>
    </button></td>
  <td>{{ student.class_name or '—' }}</td>
  <td><span aria-label="Nomor wali belum tersedia">—</span></td>
  <td>
    <div class="row-actions">
      <button type="button" class="text-action edit-action" aria-label="Edit {{ student.name }}" aria-haspopup="dialog"
        hx-get="{{ url_for('admin_student_edit', student_id=student.id) }}?{{ request.url.query }}"
        hx-target="#modal-content" hx-swap="innerHTML">
        <img src="{{ url_for('static', path='icons/pen.svg') }}" alt="" width="14" height="14">Edit
      </button>
      <button type="button" class="text-action delete-action" aria-label="Hapus {{ student.name }}"
        aria-haspopup="dialog"
        hx-get="{{ url_for('admin_student_delete_confirmation', student_id=student.id) }}?{{ request.url.query }}"
        hx-target="#modal-content" hx-swap="innerHTML">
        <img src="{{ url_for('static', path='icons/trash.svg') }}" alt="" width="14" height="14">Hapus
      </button>
    </div>
  </td>
</tr>
