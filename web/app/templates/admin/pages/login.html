<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensa | Login Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', path='tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='dashboard.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='login.css') }}">
</head>
<body class="auth-login-page">
  <main class="login-layout">
    <section class="login-card" aria-labelledby="login-title">
      <p class="login-brand">Absensa</p>
      <div class="login-heading">
        <h1 id="login-title">Masuk sebagai admin</h1>
        <p>Kelola data sekolah melalui dashboard Absensa.</p>
      </div>

      {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}

      <form class="login-form" method="post" action="{{ url_for('admin_login_submit') }}">
        <div class="login-field">
          <label for="username">Nama pengguna</label>
          <input id="username" name="username" type="text" value="{{ username }}"
                 autocomplete="username" maxlength="100" required autofocus
                 {% if error %}aria-invalid="true" aria-describedby="login-error-description"{% endif %}>
        </div>
        <div class="login-field">
          <label for="password">Kata sandi</label>
          <input id="password" name="password" type="password"
                 autocomplete="current-password" maxlength="1024" required
                 {% if error %}aria-invalid="true" aria-describedby="login-error-description"{% endif %}>
        </div>
        {% if error %}<span id="login-error-description" class="sr-only">{{ error }}</span>{% endif %}
        <button class="button login-submit" type="submit">Masuk</button>
      </form>
    </section>
  </main>
</body>
</html>
