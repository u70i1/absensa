<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kartu Siswa · Absensa</title>
<style>
  @page { size: auto; margin: 10mm; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .cards { font-size: 0; line-height: 0; }
  .student-card { display: inline-block; vertical-align: top; width: {{ config.width_mm }}mm; height: {{ config.height_mm }}mm;
    margin: 0 {{ config.gap_mm }}mm {{ config.gap_mm }}mm 0; padding: 0;
    break-inside: avoid; page-break-inside: avoid; }
  .student-card img { display: block; width: 100%; height: 100%; aspect-ratio: 5 / 8; }
  @media screen { body { padding: 10mm; background: #e8edeb; } }
  @media print { html, body { print-color-adjust: exact; -webkit-print-color-adjust: exact; } }
</style></head><body><main class="cards">{% for card in cards %}<article class="student-card"><img src="{{ card.uri }}" alt="Kartu {{ card.name }}"></article>{% endfor %}</main>
<script>
  window.addEventListener('load', async () => {
    try {
      await Promise.all(Array.from(document.images, image => image.decode()));
      await document.fonts.ready;
      await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      window.print();
    } catch (_) {
      alert('Gambar kartu gagal dimuat. Muat ulang halaman sebelum mencetak.');
    }
  });
</script></body></html>
