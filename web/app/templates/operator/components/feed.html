<div id="operator-feed" data-scan-succeeded="{{ 'true' if result else 'false' }}">
  {% include 'operator/components/scan-result.html' %}
  <section class="scan-history" aria-labelledby="scan-history-title">
    <div class="scan-history-heading"><div><h2 id="scan-history-title">Riwayat presensi</h2><p>Presensi sekolah, dari yang terbaru · {{ history_timezone }}</p></div>{% if before %}<a href="{{ url_for('operator_app') }}">Kembali ke terbaru</a>{% endif %}</div>
    <div class="data-table-scroll" tabindex="0" role="region" aria-label="Riwayat presensi sekolah">
      <table class="data-table scan-history-table"><thead><tr><th scope="col">Waktu</th><th scope="col">Siswa</th><th scope="col">Kelas</th></tr></thead><tbody>
        {% include 'operator/components/history-rows.html' %}
      </tbody></table>
    </div>
  </section>
</div>
