name: Prepare Absensa release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'u70i1/absensa'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Validate tag and test installer
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if git grep -n -I -E '^([<]{7} |[=]{7}$|[>]{7} )'; then
            echo 'Unresolved merge conflict markers found.'
            exit 1
          fi
          # Fail before any image tag or artifact can replace an existing release.
          # Include drafts; an API failure must also stop the release build.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name' > "$RUNNER_TEMP/absensa-release-tags"
          if grep -Fxq "$RELEASE_TAG" "$RUNNER_TEMP/absensa-release-tags"; then
            echo "Release $RELEASE_TAG already exists. Use a new version; do not overwrite it."
            exit 1
          fi
          python3 -m unittest discover -s deploy/installer -p 'test_*.py'
          bash -n install.sh
          shellcheck install.sh
          python3 deploy/installer/build_bootstrap.py
          git diff --exit-code -- install.sh
      - name: Windows backend safety tests
        run: python3 -m unittest discover -s deploy/windows -p 'test_*.py'

  build-linux:
    needs: validate
    if: github.repository == 'u70i1/absensa'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        id: web
        with:
          context: web
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ghcr.io/u70i1/absensa-web:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        id: backup
        with:
          context: web
          target: backup
          platforms: linux/amd64
          push: true
          tags: ghcr.io/u70i1/absensa-backup:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        id: whatsapp
        with:
          context: services/whatsapp
          platforms: linux/amd64
          push: true
          tags: ghcr.io/u70i1/absensa-whatsapp:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        id: caddy
        with:
          context: deploy/caddy
          platforms: linux/amd64
          push: true
          tags: ghcr.io/u70i1/absensa-caddy:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - name: Package manifest with image digests
        env:
          WEB_IMAGE: ghcr.io/u70i1/absensa-web@${{ steps.web.outputs.digest }}
          BACKUP_IMAGE: ghcr.io/u70i1/absensa-backup@${{ steps.backup.outputs.digest }}
          WHATSAPP_IMAGE: ghcr.io/u70i1/absensa-whatsapp@${{ steps.whatsapp.outputs.digest }}
          CADDY_IMAGE: ghcr.io/u70i1/absensa-caddy@${{ steps.caddy.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          docker pull postgres:18.4-alpine
          POSTGRES_IMAGE="$(docker image inspect postgres:18.4-alpine --format '{{index .RepoDigests 0}}')"
          export POSTGRES_IMAGE
          python3 deploy/installer/package_release.py "$RELEASE_TAG"
      - name: Test HTTPS, migrations, backups, and restoration
        run: python3 deploy/installer/smoke.py dist/release
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v3
        id: attest
        with:
          subject-path: dist/absensa-linux-amd64.tar.gz
      - name: Verify Linux provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE_PATH" dist/provenance.jsonl
          gh attestation verify dist/absensa-linux-amd64.tar.gz --bundle dist/provenance.jsonl --repo u70i1/absensa --cert-identity "https://github.com/u70i1/absensa/.github/workflows/release.yml@refs/tags/$RELEASE_TAG" --source-ref "refs/tags/$RELEASE_TAG" --deny-self-hosted-runners
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-release
          path: |
            dist/absensa-linux-amd64.tar.gz
            dist/SHA256SUMS
            dist/provenance.jsonl
          if-no-files-found: error

  build-windows:
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: ./.github/actions/windows-package
        with:
          version: ${{ github.ref_name }}
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v3
        id: attest
        with:
          subject-path: |
            dist/absensa-windows-amd64.zip
            dist/install.ps1
      - name: Verify Windows provenance
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          Copy-Item $env:BUNDLE_PATH dist/provenance-windows.jsonl
          gh attestation verify dist/absensa-windows-amd64.zip --bundle dist/provenance-windows.jsonl --repo u70i1/absensa --cert-identity "https://github.com/u70i1/absensa/.github/workflows/release.yml@refs/tags/$env:RELEASE_TAG" --source-ref "refs/tags/$env:RELEASE_TAG" --deny-self-hosted-runners
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: |
            dist/absensa-windows-amd64.zip
            dist/install.ps1
            dist/SHA256SUMS.windows
            dist/provenance-windows.jsonl
          if-no-files-found: error
      - name: Preserve diagnostic logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-diagnostics
          path: C:/ProgramData/Absensa Integration Test/logs
          retention-days: 7

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*-release'
          path: dist
          merge-multiple: true
      - name: Check both platform artifacts and create one draft (maintainer publishes)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          sha256sum --check SHA256SUMS.windows
          for platform in linux windows; do
            if [ "$platform" = linux ]; then archive=absensa-linux-amd64.tar.gz; bundle=provenance.jsonl; else archive=absensa-windows-amd64.zip; bundle=provenance-windows.jsonl; fi
            gh attestation verify "$archive" --bundle "$bundle" --repo u70i1/absensa --cert-identity "https://github.com/u70i1/absensa/.github/workflows/release.yml@refs/tags/$RELEASE_TAG" --source-ref "refs/tags/$RELEASE_TAG" --deny-self-hosted-runners
          done
          gh attestation verify install.ps1 --bundle provenance-windows.jsonl --repo u70i1/absensa --cert-identity "https://github.com/u70i1/absensa/.github/workflows/release.yml@refs/tags/$RELEASE_TAG" --source-ref "refs/tags/$RELEASE_TAG" --deny-self-hosted-runners
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Absensa $RELEASE_TAG" --notes-file ../deploy/RELEASE-NOTES.md absensa-linux-amd64.tar.gz absensa-windows-amd64.zip install.ps1 SHA256SUMS SHA256SUMS.windows provenance.jsonl provenance-windows.jsonl
