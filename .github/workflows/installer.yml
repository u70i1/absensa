name: Installer checks
on:
  push:
    branches: [main, feat/installer]
  pull_request:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Test and lint scripts
        run: |
          python3 -m unittest discover -s deploy/installer -p 'test_*.py'
          bash -n install.sh
          shellcheck install.sh
          python3 deploy/installer/build_bootstrap.py
          git diff --exit-code -- install.sh
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
