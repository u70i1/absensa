services:
  db:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=attendance
      - POSTGRES_PASSWORD=attendance
      - POSTGRES_DB=attendance
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance -d attendance"]
      interval: 10s
      timeout: 20s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
